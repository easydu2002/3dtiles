name: Reusable Build

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
        description: 'Operating system to build for (Ubuntu, macOS, or Windows runner label)'
      platform:
        required: true
        type: string
        description: 'Platform name for artifact naming (linux-x86_64, linux-arm64, macos-arm64, windows-x86_64)'
      package:
        required: false
        type: boolean
        default: false
        description: 'Whether to package the build artifacts'
    outputs:
      artifact-name:
        value: ${{ jobs.build.outputs.artifact-name }}
        description: 'Name of the uploaded artifact'

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.os }}
    env:
      VCPKG_DEFAULT_TRIPLET: ${{ inputs.platform == 'linux-arm64' && 'arm64-linux' || inputs.platform == 'linux-x86_64' && 'x64-linux' || inputs.platform == 'macos-arm64' && 'arm64-osx' || inputs.platform == 'macos-x86_64' && 'x64-osx' || 'x64-windows' }}
      VCPKG_DEFAULT_HOST_TRIPLET: ${{ inputs.platform == 'linux-arm64' && 'arm64-linux' || inputs.platform == 'linux-x86_64' && 'x64-linux' || inputs.platform == 'macos-arm64' && 'arm64-osx' || inputs.platform == 'macos-x86_64' && 'x64-osx' || 'x64-windows' }}
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      VCPKG_DOWNLOADS: ${{ github.workspace }}/vcpkg-downloads
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-archives,readwrite"
    outputs:
      artifact-name: ${{ steps.package.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Install dependencies (Linux)
        if: startsWith(inputs.os, 'ubuntu-')
        run: sudo apt-get update && sudo apt-get install -y libgl1-mesa-dev libglu1-mesa-dev libx11-dev libxrandr-dev libxi-dev libxxf86vm-dev autoconf autoconf-archive automake libtool

      - name: Install dependencies (macOS)
        if: startsWith(inputs.os, 'macos')
        run: brew install autoconf autoconf-archive automake libtool

      - name: Cache vcpkg
        uses: actions/cache/restore@v5
        id: cache-vcpkg
        with:
          path: |
            ${{ env.VCPKG_DOWNLOADS }}
            ${{ github.workspace }}/vcpkg-archives
          key: ${{ inputs.os }}-${{ inputs.platform }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ${{ inputs.os }}-${{ inputs.platform }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}-

      - name: Prepare vcpkg cache directories (Unix)
        if: inputs.os != 'windows-latest'
        shell: bash
        run: mkdir -p "$VCPKG_DOWNLOADS" "${{ github.workspace }}/vcpkg-archives"

      - name: Prepare vcpkg cache directories (Windows)
        if: inputs.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:VCPKG_DOWNLOADS
          New-Item -ItemType Directory -Force -Path '${{ github.workspace }}/vcpkg-archives'

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          doNotCache: true
          vcpkgGitCommitId: '84bab45d415d22042bd0b9081aea57f362da3f35'
          runVcpkgInstall: false

      - name: Install vcpkg dependencies (Unix, with retry)
        if: inputs.os != 'windows-latest'
        shell: bash
        run: |
          args=(install --recurse --clean-after-build --x-install-root "$VCPKG_INSTALLED_DIR" --triplet "$VCPKG_DEFAULT_TRIPLET")
          if [[ "$VCPKG_DEFAULT_TRIPLET" == "arm64-linux" || "$VCPKG_DEFAULT_TRIPLET" == "arm64-osx" ]]; then
            args+=(--allow-unsupported)
          fi
          for attempt in 1 2 3; do
            echo "vcpkg install attempt ${attempt}/3"
            log_file="vcpkg-attempt-${attempt}.log"
            set +e
            "$VCPKG_ROOT/vcpkg" "${args[@]}" 2>&1 | tee "$log_file"
            status=${PIPESTATUS[0]}
            set -e
            if [[ "$status" -eq 0 ]]; then
              exit 0
            fi
            diagnostic="$(grep -B 8 -A 3 -E 'Download failed|error:' "$log_file" | tail -n 40 || true)"
            if [[ -n "$diagnostic" ]]; then
              diagnostic="${diagnostic//'%'/'%25'}"
              diagnostic="${diagnostic//$'\r'/'%0D'}"
              diagnostic="${diagnostic//$'\n'/'%0A'}"
              echo "::error title=vcpkg attempt ${attempt} failed::${diagnostic}"
            fi
            if [[ "$attempt" -lt 3 ]]; then
              sleep $((attempt * 15))
            fi
          done
          exit 1

      - name: Install vcpkg dependencies (Windows, with retry)
        if: inputs.os == 'windows-latest'
        shell: pwsh
        run: |
          $arguments = @(
            'install', '--recurse', '--clean-after-build',
            '--x-install-root', $env:VCPKG_INSTALLED_DIR,
            '--triplet', $env:VCPKG_DEFAULT_TRIPLET
          )
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            Write-Host "vcpkg install attempt $attempt/3"
            & "$env:VCPKG_ROOT/vcpkg.exe" @arguments
            if ($LASTEXITCODE -eq 0) { exit 0 }
            if ($attempt -lt 3) { Start-Sleep -Seconds ($attempt * 15) }
          }
          exit 1

      - name: Install Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Build (Unix, with diagnostics)
        if: inputs.os != 'windows-latest'
        shell: bash
        run: |
          set +e
          cargo build -vv --release 2>&1 | tee cargo-build.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            diagnostic="$(grep -E 'undefined reference|collect2:|ld: |ld returned|cannot find -l|fatal error:|error: could not compile|signal: [0-9]+|Killed' cargo-build.log | tail -n 60 || true)"
            if [[ -z "$diagnostic" ]]; then
              diagnostic="$(tail -n 20 cargo-build.log | sed '/^[[:space:]]*Running `/d')"
            fi
            diagnostic="${diagnostic//'%'/'%25'}"
            diagnostic="${diagnostic//$'\r'/'%0D'}"
            diagnostic="${diagnostic//$'\n'/'%0A'}"
            echo "::error title=cargo build failed::${diagnostic}"
          fi
          exit "$status"
        env:
          VCPKG_HAS_BEEN_INSTALLED: 1

      - name: Build (Windows)
        if: inputs.os == 'windows-latest'
        run: cargo build -vv --release
        env:
          VCPKG_HAS_BEEN_INSTALLED: 1

      - name: Package (Unix)
        id: package
        if: inputs.package && inputs.os != 'windows-latest'
        run: |
          mkdir -p release
          cp target/release/_3dtile release/
          cp -r -v target/release/gdal release/
          cp -r -v target/release/proj release/
          cp -r -v target/release/osgPlugins-3.6.5 release/
          tar -czf _3dtile-${{ inputs.platform }}.tar.gz -C release .
          echo "artifact-name=${{ inputs.platform }}" >> $GITHUB_OUTPUT

      - name: Package (Windows)
        id: package-windows
        if: inputs.package && inputs.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release
          Copy-Item target/release/_3dtile.exe release/
          Copy-Item "$env:VCPKG_INSTALLED_DIR/$env:VCPKG_DEFAULT_TRIPLET/bin/*.dll" release/
          Copy-Item -Recurse target/release/gdal release/
          Copy-Item -Recurse target/release/proj release/
          Copy-Item -Recurse target/release/osgPlugins-3.6.5 release/
          Compress-Archive -Path release/* -DestinationPath _3dtile-${{ inputs.platform }}.zip
          echo "artifact-name=${{ inputs.platform }}" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        if: inputs.package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.platform }}
          path: _3dtile-${{ inputs.platform }}${{ inputs.os == 'windows-latest' && '.zip' || '.tar.gz' }}

      - name: Save vcpkg cache
        if: always() && steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            ${{ env.VCPKG_DOWNLOADS }}
            ${{ github.workspace }}/vcpkg-archives
          key: ${{ inputs.os }}-${{ inputs.platform }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'vcpkg-overlays/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
