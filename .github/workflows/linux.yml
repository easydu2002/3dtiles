name: Ubuntu

on:
  workflow_dispatch:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write

jobs:
  build-and-test:
    uses: ./.github/workflows/build.yml
    with:
      # Match the ARM64 baseline so both server bundles run on Ubuntu 22.04+.
      os: ubuntu-22.04
      platform: linux-x86_64
      package: true
