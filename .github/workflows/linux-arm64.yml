name: Ubuntu ARM64

on:
  workflow_dispatch:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write

jobs:
  build-and-test:
    uses: ./.github/workflows/build.yml
    with:
      # Build on the oldest supported native ARM64 runner so the downloadable
      # binary works on glibc 2.35+ instead of requiring Ubuntu 24.04.
      os: ubuntu-22.04-arm
      platform: linux-arm64
      package: true
