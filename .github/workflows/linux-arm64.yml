name: Ubuntu ARM64

on:
  workflow_dispatch:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: write

jobs:
  build-and-test:
    uses: ./.github/workflows/build.yml
    with:
      os: ubuntu-24.04-arm
      platform: linux-arm64
      package: true
